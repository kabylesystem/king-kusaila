include hyde.conf
# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME

# ───── Réglages perso (naly) ─────
# Tout texte sélectionné est copié direct dans le presse-papier système
copy_on_select clipboard
# Traînée animée du curseur (l'effet que naly aimait sous Ubuntu). Plus haut = traînée plus longue.
cursor_trail 3
cursor_trail_decay 0.1 0.4
# Molette un peu plus punchy (défaut 5.0)
wheel_scroll_multiplier 8.0

# ───── Vue IDE (sidebar fichiers yazi + Claude Code) ─────
# Permet à la fonction fish `claude` de splitter la fenêtre toute seule.
allow_remote_control yes
# splits = sidebar + Claude côte à côte ; stack = un pane en plein écran (le toggle).
enabled_layouts splits,stack
# Ctrl+B (comme VS Code) : masquer/réafficher la sidebar.
# On va d'abord sur le pane de droite (Claude) PUIS on zoome → c'est toujours
# Claude qui passe en grand et yazi qui disparaît, quel que soit le focus.
map ctrl+b combine : neighboring_window right : toggle_layout stack

# ───── Glass (premium) : terminal transparent → le wallpaper flouté de Hyprland
# traverse nvim (qui est en thème transparent). Le flou, c'est Hyprland qui le fait.
background_opacity 0.85
dynamic_background_opacity yes

# ───── Clic droit : ne PAS afficher le menu kitty, laisser nvim le recevoir
# (pour que le clic droit dans neo-tree crée un fichier).
mouse_map right press ungrabbed no-op
mouse_map right press grabbed no-op


listen_on unix:@kitty-{kitty_pid}
