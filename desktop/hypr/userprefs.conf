# Set your personal hyprland configuration here
# See https://wiki.hypr.land/Configuring for more information

# Verrouillage immediat a l'ouverture de session : avec l'autologin SDDM, c'est
# hyprlock qui devient l'ecran de connexion vu au demarrage (meme ecran que le
# verrouillage de session, avec l'empreinte). Repli sur le lanceur HyDE si hyprlock
# echoue, pour ne jamais laisser le bureau ouvert.
exec-once = hyprlock || hyde-shell lockscreen.sh

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hypr.land/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    # numlock_by_default = true

    # Souris : réglage repris de l'ancienne config Lua CachyOS (voir mémoire migration-cachyos-etat).
    sensitivity = 0.6
    accel_profile = flat

    # 🔗 See https://wiki.hypr.land/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# Désactivé pour naly : le défaut HyDE `3 doigts horizontal = workspace`
# provoquait des changements de bureau involontaires pendant le travail.
gesture = 3, horizontal, unset

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

# ───── Raccourcis perso (naly) ─────
# Super+Espace = lanceur Claude : sélecteur de dossier (fzf) puis claude dedans
bind = SUPER, space, exec, kitty --title "Claude Launcher" -e ~/.local/bin/claude-here.sh
# Touche Print (PrtSc) = sélectionner une zone → copie direct dans le presse-papier (sans notif moche)
unbind = , Print
bind = , Print, exec, grimblast copy area
# Super+R = ranger/compacter les n° de workspaces (ex: 3,7,8 → 1,2,3) — manuel, sans saut d'écran
bindd = SUPER, R, [Workspaces] compacter les numéros, exec, ~/.local/bin/hypr-compact-ws.sh

# King Kusaila voice layer
# Super+C = dictee locale Whisper -> colle dans la fenetre active + journalise
# Super+V = mission vocale -> demande background/terminal puis lance King Kusaila
unbind = SUPER, C
unbind = SUPER, V
bind = SUPER, C, exec, /home/kusaila/.local/bin/voice-dictate-toggle

unbind = SUPER, P
bind = SUPER, P, exec, /home/kusaila/.local/bin/telegram-focus
bind = SUPER, V, exec, /home/kusaila/.local/bin/king-kusaila-toggle
# Super+Shift+V = mission par TEXTE (coller un long prompt) -> meme pipeline que la voix
unbind = SUPER SHIFT, V
bind = SUPER SHIFT, V, exec, /home/kusaila/.local/bin/king-kusaila-text
# cliphist (ex-Super+Shift+V) deplace sur Super+Ctrl+V pour ne rien perdre
unbind = SUPER CTRL, V
bind = SUPER CTRL, V, exec, pkill -x rofi || hyde-shell cliphist
# Super+Q = annuler une mission King en cours (missclick) ; sinon fermer la fenetre focus
unbind = SUPER, Q
bind = SUPER, Q, exec, /home/kusaila/.local/bin/king-kusaila-cancel
# Super+Shift+C = Spotlight des conversations Claude Code (fzf flottant : cherche dans le CONTENU,
# ENTER rouvre la conv dans Claude Code via claude --resume)
bind = SUPER SHIFT, C, exec, kitty --title claude-convs-spotlight /home/kusaila/.local/bin/claude-convs
windowrule = float true, match:title ^(claude-convs-spotlight)$
windowrule = center true, match:title ^(claude-convs-spotlight)$
windowrule = size 1280 800, match:title ^(claude-convs-spotlight)$
exec-once = /home/kusaila/.local/bin/king-kusaila-visual --daemon-start
windowrule = float true, match:title ^(King Kusaila Text)$
windowrule = center true, match:title ^(King Kusaila Text)$
windowrule = opacity 1.0 1.0, match:title ^(King Kusaila Text)$
windowrule = float true, match:title ^(King Kusaila Visual)$
windowrule = pin true, match:title ^(King Kusaila Visual)$
windowrule = decorate false, match:title ^(King Kusaila Visual)$
windowrule = border_size 0, match:title ^(King Kusaila Visual)$
windowrule = rounding 0, match:title ^(King Kusaila Visual)$
windowrule = opacity 1.0 1.0, match:title ^(King Kusaila Visual)$
windowrule = no_blur true, match:title ^(King Kusaila Visual)$
windowrule = float true, match:title ^(King Kusaila Choice)$
windowrule = pin true, match:title ^(King Kusaila Choice)$
windowrule = decorate false, match:title ^(King Kusaila Choice)$
windowrule = border_size 0, match:title ^(King Kusaila Choice)$
windowrule = rounding 0, match:title ^(King Kusaila Choice)$
windowrule = opacity 1.0 1.0, match:title ^(King Kusaila Choice)$
windowrule = no_blur true, match:title ^(King Kusaila Choice)$

# (désactivé 2026-06-28) on garde les notifs discrètes en liquid glass + bouton DND dans la waybar pour couper à la demande
# exec-once = sleep 4 && dunstctl set-paused true

# Volume + (F12 / touche media) DÉ-MUTE d'abord, comme sous Ubuntu/GNOME :
# monter le son après un mute (F10) doit rendre le son direct, sans re-appuyer F10.
unbind = , F12
unbind = , XF86AudioRaiseVolume
bindel = , F12, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; hyde-shell volumecontrol -o i
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; hyde-shell volumecontrol -o i

# Liquid glass pour les notifs dunst (namespace "notifications") : blur Hyprland + alpha translucide
layerrule = blur true, match:namespace notifications
layerrule = ignore_alpha 0.1, match:namespace notifications
layerrule = xray false, match:namespace notifications

# ───── Look global naly : ZÉRO bordure + fenêtres translucides (glass partout) ─────
general {
    border_size = 0
}
decoration {
    rounding = 10
    active_opacity = 0.92
    inactive_opacity = 0.90

    # xray : le flou prend le fond d ecran au lieu de re-flouter chaque fenetre
    # empilee derriere. Rendu identique a l oeil, cout GPU divise par 2,6 —
    # mesure le 2026-08-26 : 39,7 % / 2,6 W  ->  19,1 % / 1,0 W, bureau au repos.
    blur {
        enabled = true
        passes = 3
        size = 6
        xray = true
        new_optimizations = true
    }
}
# Surcharge des règles d'opacité par-app de HyDE — léger, propre (les apps "contenu" supportent mal la grosse transparence)
# inactive proche de active => les fenêtres non focus restent bien visibles
# Navigateurs/vidéo : transparence DOUCE (sinon illisible/bizarre)
windowrule = opacity 0.94 0.92, match:class ^(brave-browser)$
windowrule = opacity 0.94 0.92, match:class ^(firefox)$
windowrule = opacity 0.94 0.92, match:class ^(zen)$
windowrule = opacity 0.94 0.92, match:class ^([Ss]potify)$
# Terminaux/éditeurs : un peu plus de glass mais lisibles même non focus
windowrule = opacity 0.88 0.85, match:class ^(kitty)$
windowrule = opacity 0.88 0.85, match:class ^([Cc]ode)$
windowrule = opacity 0.90 0.87, match:class ^(org.kde.dolphin)$

# Super+O = ouvrir Signal Desktop
unbind = SUPER, O
bind = SUPER, O, exec, signal-desktop

# Panneau de contrôle King Kusaila (ouvert depuis l'icône Waybar)
windowrule = float true, match:title ^(King Kusaila Panel)$
windowrule = pin true, match:title ^(King Kusaila Panel)$
windowrule = decorate false, match:title ^(King Kusaila Panel)$
windowrule = rounding 14, match:title ^(King Kusaila Panel)$
windowrule = move 100%-280 46, match:title ^(King Kusaila Panel)$
windowrule = no_blur false, match:title ^(King Kusaila Panel)$

# Calendrier gsimplecal (clic sur l'horloge waybar) : flottant, ouvert SOUS le curseur
# (donc sous l'horloge, façon GNOME) au lieu d'être centré en plein écran.
windowrule = float true, match:class ^(gsimplecal)$
windowrule = animation none, match:class ^(gsimplecal)$

# Persistance custos desktop au boot (King waybar + glass dunst) — double sécurité avec le watcher systemd naly-desktop-restore.path
exec-once = sleep 4 && /home/kusaila/.local/bin/naly-desktop-restore

# Session restore : au boot, propose de rouvrir les fenêtres de la session précédente
# (snapshots : hypr-session-save.timer toutes les 2 min → ~/.local/state/hypr-session/)
exec-once = sleep 6 && /home/kusaila/.local/bin/hypr-session-prompt

# naly : serveur de notifications maison a la place de dunst
exec-once = $HOME/.local/bin/naly-notify

