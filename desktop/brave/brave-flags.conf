# password-store=basic : ne dépend d'aucun trousseau système (gnome-keyring/kwallet
# supprimés) pour chiffrer cookies/mots de passe -> plus de perte de session au reboot
--password-store=basic

# Decodage video par la puce dediee au lieu du processeur (pilote iHD present,
# H264/VP9/AV1 tous supportes en materiel). Sans ces drapeaux Brave decodait en
# logiciel : moteur Video a 3 % pendant que Render/3D montait a 28 %.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiIgnoreDriverChecks
