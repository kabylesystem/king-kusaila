# Bloc King Kusaila à coller dans ~/.config/hypr/userprefs.conf

# King Kusaila voice layer
# Super+V = mission vocale -> demande background/terminal puis lance King Kusaila
unbind = SUPER, C
unbind = SUPER, V
bind = SUPER, C, exec, /home/kusaila/.local/bin/voice-dictate-toggle
bind = SUPER, V, exec, /home/kusaila/.local/bin/king-kusaila-toggle
# Super+Shift+V = mission par TEXTE (coller un long prompt) -> meme pipeline que la voix
unbind = SUPER SHIFT, V
bind = SUPER SHIFT, V, exec, /home/kusaila/.local/bin/king-kusaila-text
# cliphist (ex-Super+Shift+V) deplace sur Super+Ctrl+V pour ne rien perdre
unbind = SUPER CTRL, V
bind = SUPER CTRL, V, exec, pkill -x rofi || hyde-shell cliphist
# Super+Q = annuler une mission King en cours (missclick) ; sinon fermer la fenetre focus
unbind = SUPER, Q
bind = SUPER, Q, exec, /home/kusaila/.local/bin/king-kusaila-cancel
# Super+Shift+C = Spotlight des conversations Claude Code (fzf flottant : cherche dans le CONTENU,
# ENTER rouvre la conv dans Claude Code via claude --resume)
bind = SUPER SHIFT, C, exec, kitty --title claude-convs-spotlight /home/kusaila/.local/bin/claude-convs
windowrule = float true, match:title ^(claude-convs-spotlight)$
windowrule = center true, match:title ^(claude-convs-spotlight)$
windowrule = size 1280 800, match:title ^(claude-convs-spotlight)$
exec-once = /home/kusaila/.local/bin/king-kusaila-visual --daemon-start
windowrule = float true, match:title ^(King Kusaila Text)$
windowrule = center true, match:title ^(King Kusaila Text)$
windowrule = opacity 1.0 1.0, match:title ^(King Kusaila Text)$
windowrule = float true, match:title ^(King Kusaila Visual)$
windowrule = pin true, match:title ^(King Kusaila Visual)$
windowrule = decorate false, match:title ^(King Kusaila Visual)$
windowrule = border_size 0, match:title ^(King Kusaila Visual)$
windowrule = rounding 0, match:title ^(King Kusaila Visual)$
windowrule = opacity 1.0 1.0, match:title ^(King Kusaila Visual)$
windowrule = no_blur true, match:title ^(King Kusaila Visual)$
windowrule = float true, match:title ^(King Kusaila Choice)$
windowrule = pin true, match:title ^(King Kusaila Choice)$
windowrule = decorate false, match:title ^(King Kusaila Choice)$
windowrule = border_size 0, match:title ^(King Kusaila Choice)$
windowrule = rounding 0, match:title ^(King Kusaila Choice)$
windowrule = opacity 1.0 1.0, match:title ^(King Kusaila Choice)$
windowrule = no_blur true, match:title ^(King Kusaila Choice)$

# Volume + (F12 / touche media) DÉ-MUTE d'abord, comme sous Ubuntu/GNOME :
# monter le son après un mute (F10) doit rendre le son direct, sans re-appuyer F10.
unbind = , F12
unbind = , XF86AudioRaiseVolume
bindel = , F12, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; hyde-shell volumecontrol -o i
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; hyde-shell volumecontrol -o i
